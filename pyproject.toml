[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "rare-quickprot"
version = "1.9.0" # Don't forget to match with version.py
authors = [
    { name="Anthony Aylward", email="anthony.aylward@protonmail.com" },
]
description = "homology-based method for predicting gene models across entire genomes"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "biopython",
    "TD2"
]

[project.urls]
"Homepage" = "https://github.com/anthony-aylward/quickprot"
"Documentation" = "https://github.com/anthony-aylward/quickprot"

[project.scripts]
quickprot = "quickprot.quickprot:main"

[tool.setuptools]
package-dir = {quickprot="src/quickprot"}
script-files = [
    "src/quickprot/quckprot.py",
    "script/add_type_gff3.py",
    "extract_sequence_from_gff3.py",
    "filter_repeatPeps_from_gff3.py",
    "get_intron_from_gff3.py",
    "get_longest_transcript_gff3.py",
    "gtf_genome_to_cdna_fasta.py",
    "rename_gff3.py",
    "sm2rmForFasta.py",
    "sort_gff3.py",
    "split_and_filter_gene_model.py",
    "stat_gff3.py",
    "update_gff3_from_minibusco.py"
]
